# Publica o release compilado quando uma tag v* é empurrada: testa, empacota os
# binários de macOS e Linux (make dist) e cria o release no GitHub. Tag com "-"
# (ex.: v0.2.0-rc1) vira prerelease.
#
# Fora de tag (push em feat/release ou execução manual) é um ensaio: testa e
# empacota com VERSION=v0.0.0-ci, sem publicar nada.
name: Release

on:
  push:
    tags: ["v*"]
    branches: ["feat/release"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: make web
        run: make web

      - name: make test
        run: make test

      - name: make dist
        run: |
          case "$GITHUB_REF" in
          refs/tags/v*) V="$GITHUB_REF_NAME" ;;
          *) V=v0.0.0-ci ;;
          esac
          make dist VERSION="$V"

      - name: criar o release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -- --verify-tag --generate-notes
          case "$GITHUB_REF_NAME" in
          *-*) set -- "$@" --prerelease ;;
          esac
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt "$@"
